[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erbium"
version = "0.3.4"
description = "amplimit's Internal Computing Platform, forked from Project Neura's Erbium"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "amplimit" },
    { name = "Project Neura", email = "central@projectneura.org" }
]
dependencies = ["fastapi", "uvicorn", "pydantic", "nvidia-ml-py", "psutil", "matplotlib", "huggingface-hub>=1.5.0"]

[project.optional-dependencies]
all = ["py-cpuinfo"]

[tool.hatch.build.targets.sdist]
only-include = ["erbium", "erbium_on_vast"]

[tool.hatch.build.targets.wheel]
packages = ["erbium", "erbium_on_vast"]

[project.urls]
Homepage = "https://github.com/amplimit/Erbium"
Documentation = "https://github.com/amplimit/Erbium"
Repository = "https://github.com/amplimit/Erbium"

[project.scripts]
erbium = "erbium:__entry__"
erbium-on-vast = "erbium_on_vast:__entry__"
