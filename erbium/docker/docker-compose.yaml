services:
  SERVICE_NAME:
    image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    hostname: erbium
    container_name: erbium
    networks: [labnet]
    init: true
    volumes:
      - erbium_app:/workspace/app
      - erbium_venv:/workspace/venv
      - erbium_pvenvs:/workspace/pvenvs
      - erbium_codex:/home/access/.codex
      - erbium_claude:/home/access/.claude
      - erbium_state:/var/lib/erbium
      - ./motd:/etc/motd:ro
      - ./venv.sh:/etc/profile.d/venv.sh:ro
      # ERBIUM_BACKUP_SECTION_START
      - ./backup-output.sh:/workspace/backup-output.sh:ro
      # ERBIUM_BACKUP_SECTION_END
      - ./skills:/opt/erbium-skills:ro
      - S:/erbium_input:/workspace/input:ro
      - S:/erbium_output:/workspace/output
      # ERBIUM_BACKUP_SECTION_START
      - S:/erbium_backup:/workspace/backup
      # ERBIUM_BACKUP_SECTION_END
      # ERBIUM_HOST_PACKAGES_SECTION_START
      - ERBIUM_HOST_SITE_PACKAGES:ERBIUM_HOST_SITE_PACKAGES:ro
      # ERBIUM_HOST_PACKAGES_SECTION_END
    # ERBIUM_ENV_SECTION_START
    env_file:
      - ERBIUM_ENV_FILE
    # ERBIUM_ENV_SECTION_END
    shm_size: 16gb
    pids_limit: 8192
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # ERBIUM_BACKUP_SECTION_START
      BORG_REPO: /workspace/backup
      # ERBIUM_BACKUP_SECTION_END
      # ERBIUM_HOST_PACKAGES_SECTION_START
      ERBIUM_HOST_PACKAGES: ERBIUM_HOST_SITE_PACKAGES
      # ERBIUM_HOST_PACKAGES_SECTION_END
    command: >
      bash -lc '
              set -e
              apt-get update && apt-get upgrade -y && apt-get autoremove -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl unzip zip wget git gnupg openssh-server python3 python3-venv python3-pip tmux vim borgbackup nodejs npm bubblewrap
              install -d -m 755 /etc/apt/keyrings /etc/apt/sources.list.d
              curl -fsSL -o /etc/apt/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
              chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gh
              npm i -g @openai/codex @anthropic-ai/claude-code
              npm update -g @openai/codex @anthropic-ai/claude-code
              mkdir -p /var/run/sshd
              id -u access >/dev/null 2>&1 || useradd -m -s /bin/bash access
              usermod -p "*" access
              groupadd -f video
              groupadd -f render
              usermod -aG video,render access || true
              chown access:access /home/access /workspace/app /workspace/output /workspace/venv /workspace/pvenvs
              chown -R access:access /home/access/.codex /home/access/.claude
              chown root:root /var/lib/erbium
              chmod 700 /var/lib/erbium
              install -d -o root -g root -m 755 /etc/erbium /etc/erbium/authorized_keys
              su - access -c "mkdir -p ~/.claude/skills/use-erbium ~/.codex/skills/use-erbium"
              su - access -c "ln -sfn /opt/erbium-skills/use-erbium/SKILL.md ~/.claude/skills/use-erbium/SKILL.md"
              su - access -c "ln -sfn /opt/erbium-skills/use-erbium/SKILL.md ~/.codex/skills/use-erbium/SKILL.md"
              su - access -c "curl -LsSf https://astral.sh/uv/install.sh | sh"
              curl -LsSf https://astral.sh/uv/install.sh | sh
              if [ -n "$${ERBIUM_HOST_PACKAGES:-}" ]; then
                rm -rf /workspace/venv/* /workspace/venv/.[!.]* /workspace/venv/..?*
                if [ ! -x /opt/erbium/jupyter/bin/jupyter ]; then
                  rm -rf /opt/erbium/jupyter
                  /root/.local/bin/uv venv --python /usr/bin/python3 /opt/erbium/jupyter
                  /root/.local/bin/uv pip install --python /opt/erbium/jupyter/bin/python jupyterlab jupyter-archive
                fi
                if ! /usr/bin/python3 -I -c "import os, sys; sys.exit(os.environ[\"ERBIUM_HOST_PACKAGES\"] not in sys.path)"; then
                  echo "$$ERBIUM_HOST_PACKAGES is not on the sys.path of /usr/bin/python3, use a base image with the same Python version as the host" >&2
                  exit 1
                fi
                if ! /usr/bin/python3 -I -S -c "import sys; sys.path.append(\"/opt/erbium/kernel\"); import ipykernel, erbium" >/dev/null 2>&1; then
                  rm -rf /opt/erbium/kernel
                  /root/.local/bin/uv pip install --python /usr/bin/python3 --target /opt/erbium/kernel ipykernel git+https://github.com/amplimit/Erbium
                fi
                echo /opt/erbium/kernel > /usr/lib/python3/dist-packages/erbium-kernel.pth
                install -d -m 755 /opt/erbium/jupyter/share/jupyter/kernels/python3
                printf "%s\n" "{\"argv\": [\"/usr/bin/python3\", \"-m\", \"ipykernel_launcher\", \"-f\", \"{connection_file}\"], \"display_name\": \"Python 3\", \"language\": \"python\"}" > /opt/erbium/jupyter/share/jupyter/kernels/python3/kernel.json
                rm -rf /usr/local/share/jupyter/kernels/python3
                JUPYTER=/opt/erbium/jupyter/bin/jupyter
              else
                if [ ! -x /workspace/venv/bin/python ] || ! su - access -c "/workspace/venv/bin/python -c \"import sys\"" >/dev/null 2>&1; then
                  rm -rf /workspace/venv/* /workspace/venv/.[!.]* /workspace/venv/..?*
                  su - access -c "uv venv --python /usr/bin/python3 /workspace/venv"
                fi
                if [ ! -x /workspace/venv/bin/jupyter ] || ! su - access -c "/workspace/venv/bin/python -c \"import erbium, torch, torchvision, jupyterlab, jupyter_server\"" >/dev/null 2>&1; then
                  su - access -c "uv pip install --python /workspace/venv/bin/python --upgrade torch torchvision jupyterlab jupyter-archive git+https://github.com/amplimit/Erbium"
                fi
                JUPYTER=/workspace/venv/bin/jupyter
              fi
              if ! /opt/erbium/venv/bin/python -c "import erbium" >/dev/null 2>&1; then
                rm -rf /opt/erbium/venv
                /root/.local/bin/uv venv --python /usr/bin/python3 /opt/erbium/venv
                /root/.local/bin/uv pip install --python /opt/erbium/venv/bin/python git+https://github.com/amplimit/Erbium
              fi
              if [ -n "$${ERBIUM_HOST_PACKAGES:-}" ]; then
                /opt/erbium/venv/bin/python -m erbium docker scripts "$$ERBIUM_HOST_PACKAGES" /opt/erbium/host-bin
              fi
              # ERBIUM_BACKUP_SECTION_START
              chown root:root /workspace/backup
              chmod 700 /workspace/backup
              if [ ! -f /workspace/backup/config ]; then
                borg init --encryption=none /workspace/backup
              fi
              (
                while true; do
                /workspace/backup-output.sh || true
                sleep 43200
                done
              ) &
              # ERBIUM_BACKUP_SECTION_END
              printf "%s\n" "PermitRootLogin no" "PubkeyAuthentication yes" "PasswordAuthentication yes" "KbdInteractiveAuthentication no" "AuthorizedKeysFile /etc/erbium/authorized_keys/%u" "AllowUsers access" > /etc/ssh/sshd_config.d/erbium.conf
              : > /etc/erbium/authorized_keys/access
              chmod 644 /etc/erbium/authorized_keys/access
              /usr/sbin/sshd
              /opt/erbium/venv/bin/python -m erbium server run -p 8000 --jupyter_executable "$$JUPYTER"
            '
    restart: no
networks:
  labnet:
    external: true
volumes:
  erbium_app:
  erbium_venv:
  erbium_pvenvs:
  erbium_codex:
  erbium_claude:
  erbium_state:
